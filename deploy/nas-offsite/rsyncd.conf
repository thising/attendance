# The container runtime fixes the daemon identity at 1003:100.  Leaving
# rsync's per-module uid/gid unset avoids privileged setgroups/setuid calls.
use chroot = no
strict modes = yes
max connections = 1
pid file = /tmp/rsyncd.pid
lock file = /tmp/rsyncd.lock
log file = /logs/rsyncd.log
port = 1873
address = 0.0.0.0
reverse lookup = no
timeout = 900

[duxing-incoming]
path = /data/incoming
comment = Duxing business archive incoming mirror
read only = no
write only = no
list = no
auth users = duxing
secrets file = /run/secrets/rsyncd.secrets
hosts allow = 100.111.125.54
incoming chmod = Du=rwx,Dgo=,Fu=rw,Fgo=
munge symlinks = yes
refuse options = links, hard-links, copy-links, copy-unsafe-links, safe-links, devices, specials

[duxing-history]
path = /data/snapshots
comment = Duxing business archive completed snapshots (read only)
read only = yes
list = no
auth users = duxing
secrets file = /run/secrets/rsyncd.secrets
hosts allow = 100.111.125.54
munge symlinks = yes
refuse options = links, hard-links, copy-links, copy-unsafe-links, safe-links, devices, specials
